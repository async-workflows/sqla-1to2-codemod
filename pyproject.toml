[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqla-1to2-codemod"
version = "0.1.0"
description = "A conservative codemod CLI that upgrades legacy SQLAlchemy 1.x code to modern 2.0 style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "async-workflows" }]
keywords = [
    "sqlalchemy",
    "codemod",
    "migration",
    "refactoring",
    "sqlalchemy-2.0",
    "orm",
    "libcst",
    "upgrade",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = ["libcst>=1.1"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/async-workflows/sqla-1to2-codemod"
Documentation = "https://www.async-workflows.com"
Issues = "https://github.com/async-workflows/sqla-1to2-codemod/issues"

[project.scripts]
sqla-1to2-codemod = "sqla_1to2_codemod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqla_1to2_codemod"]
